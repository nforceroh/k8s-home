kind: Deployment
apiVersion: apps/v1
metadata:
  name: navidrome
  labels:
    app: navidrome
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: navidrome
  template:
    metadata:
      labels:
        app: navidrome
    spec:
      serviceAccountName: navidrome-sa
      containers:
        - name: navidrome
          image: deluan/navidrome:develop
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: navidrome-config
          ports:
            - containerPort: 4533
              name: navidrome-port
              protocol: TCP
          resources:
            requests:
              cpu: 20m
              memory: 100Mi
          volumeMounts:
            - name: navidrome-pv
              mountPath: /data
            - name: music-clean
              mountPath: /music
            - name: aurral-downloads
              mountPath: /music/playlists/aurral
      volumes:
        - name: navidrome-pv
          persistentVolumeClaim:
            claimName: navidrome-pvc
        - name: music-clean
          hostPath:
            path: /mnt/ssd01/Music/Cleaned
            type: Directory
        - name: aurral-downloads
          hostPath:
            path: /mnt/ssd01/Music/downloads/aurral
            type: Directory