kind: Deployment
apiVersion: apps/v1
metadata:
  name: dn-dev
  labels:
    app: dn-dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dn-dev
  template:
    metadata:
      labels:
        app: dn-dev
    spec:
      serviceAccountName: dn-sa
      securityContext:
        runAsUser: 3000
        runAsGroup: 3000
        fsGroup: 3000
      containers:
        - name: dn-dev
          image: ghcr.io/droppedneedle/droppedneedle:latest
          imagePullPolicy: Always
          env:
            - name: PUID
              value: "3000"
            - name: PGID
              value: "3000"
            - name: PORT
              value: "8688"
            - name: TZ
              value: "America/New_York"
            - name: SLSKD_DOWNLOADS_PATH
              value: "/music/downloads/slskd"
          ports:
            - name: http
              containerPort: 8688
          volumeMounts:
            - name: dn-dev-config
              mountPath: /app/config
            - name: dn-dev-cache
              mountPath: /app/cache
            - name: cleaned-music
              mountPath: /music/cleaned
            - name: slskd
              mountPath: /music/downloads/slskd
      volumes:
        - name: dn-dev-config
          persistentVolumeClaim:
            claimName: dn-dev-config-pvc
        - name: dn-dev-cache
          persistentVolumeClaim:
            claimName: dn-dev-cache-pvc
        - name: cleaned-music
          hostPath:
            path: /mnt/ssd01/Music/Library
            type: Directory
        - name: slskd
          hostPath:
            path: /mnt/ssd01/Music/downloads/slskd
            type: Directory