kind: Deployment
apiVersion: apps/v1
metadata:
  name: droppedneedle
  labels:
    app: droppedneedle
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: droppedneedle
  template:
    metadata:
      labels:
        app: droppedneedle
    spec:
      serviceAccountName: droppedneedle-sa
      securityContext:
        runAsUser: 3000
        runAsGroup: 3000
        fsGroup: 3000
      containers:
        - name: droppedneedle
          image: ghcr.io/droppedneedle/droppedneedle:latest
          imagePullPolicy: Always
          env:
            - name: PUID
              value: "3000"
            - name: PGID
              value: "3000"
            - name: PORT
              value: "8688"
            - name: TZ
              value: "America/New_York"
            - name: SLSKD_DOWNLOADS_PATH
              value: "/music/downloads/slskd"
          ports:
            - name: http
              containerPort: 8688
          volumeMounts:
            - name: droppedneedle-data
              mountPath: /app/config
              subPath: config
            - name: droppedneedle-data
              mountPath: /app/cache
              subPath: cache
            - name: music
              mountPath: /music
      volumes:
        - name: droppedneedle-data
          persistentVolumeClaim:
            claimName: droppedneedle-pvc
        - name: music
          hostPath:
            path: /mnt/ssd01/Music
            type: Directory