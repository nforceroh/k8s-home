sieve_plugins {
  sieve_extprograms = yes
}

sieve_global_extensions {
  vnd.dovecot.pipe = yes
}

# Pipe scripts land here via the existing sieve-init script (copied from
# /configfiles/sieve), so this points at the post-copy location, not the
# ConfigMap mount itself.
sieve_pipe_bin_dir = /data/sieve

sieve_script relayer_before {
  type = before
  # Same reasoning -- the existing sieve-init script copies our
  # global-before.sieve from /configfiles/sieve into /data/sieve and
  # pre-compiles + chowns it there, so no bin_path workaround is needed:
  # vmail already owns everything under /data/sieve by the time Dovecot
  # runs it.
  path = /data/sieve/global-before.sieve
}

# Defensive: safe no-op if already enabled elsewhere in your config (this
# is a boolean-list setting that merges across files rather than
# overwrites), but ensures Sieve actually runs on LMTP delivery if it
# wasn't already turned on.
protocol lmtp {
  mail_plugins {
    sieve = yes
  }
}
