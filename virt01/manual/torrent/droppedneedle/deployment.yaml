kind: Deployment
apiVersion: apps/v1
metadata:
  name: droppedneedle
  labels:
    app: droppedneedle
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: droppedneedle
  template:
    metadata:
      labels:
        app: droppedneedle
      annotations:
        setGateway: "true"
    spec:
      serviceAccountName: droppedneedle-sa
      securityContext:
        runAsUser: 3000
        runAsGroup: 3000
        fsGroup: 3000
      containers:
        - name: droppedneedle
          image: ghcr.io/droppedneedle/droppedneedle:latest
          imagePullPolicy: Always
          env:
            - name: PUID
              value: "3000"
            - name: PGID
              value: "3000"
            - name: PORT
              value: "8688"
            - name: TZ
              value: "America/New_York"
            - name: SLSKD_DOWNLOADS_PATH
              value: "/music/downloads/slskd/complete"
          ports:
            - name: http
              containerPort: 8688
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 4Gi
          # startupProbe:
          #   httpGet:
          #     path: /health
          #     port: http
          #   # 20 * 30s = 10 minutes max startup/migration time
          #   failureThreshold: 20
          #   periodSeconds: 30
          # livenessProbe:
          #   httpGet:
          #     path: /health
          #     port: http
          #   periodSeconds: 30
          #   timeoutSeconds: 10
          #   failureThreshold: 3
          # readinessProbe:
          #   httpGet:
          #     path: /health
          #     port: http
          #   periodSeconds: 30
          #   timeoutSeconds: 10
          #   failureThreshold: 3
          volumeMounts:
            - name: droppedneedle-data
              mountPath: /app/config
              subPath: config
            - name: droppedneedle-data
              mountPath: /app/cache
              subPath: cache
            - name: music
              mountPath: /music
      volumes:
        - name: droppedneedle-data
          persistentVolumeClaim:
            claimName: droppedneedle-pvc
        - name: music
          hostPath:
            type: Directory
            path: /mnt/ssd01/Music
