apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app: deluge

namespace: torrent

resources:
  - deployment.yaml
  - service.yaml
  - serviceaccount.yaml
  - ingress.yaml
  - networkpolicy.yaml
#   - backup-schedule.yaml
#   - maps/wg-config-sealed.yaml # superseded by pod-gateway webhook VPN routing
  
configMapGenerator:
- name: web-conf-cm
  files:
  - web.conf=maps/web.conf
- name: core-conf-cm
  files:
  - core.conf=maps/core.conf

generatorOptions:
  disableNameSuffixHash: true