kind: Deployment
apiVersion: apps/v1
metadata:
  name: slskd
  labels:
    app: slskd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: slskd
  template:
    metadata:
      labels:
        app: slskd
      annotations:
        # Opts this pod into the pod-gateway webhook (VPN egress routing).
        setGateway: "true"
    spec:
      serviceAccountName: slskd-sa
      securityContext:
        runAsUser: 3000
        runAsGroup: 3000
        fsGroup: 3000      
      containers:
        - name: slskd
          image: slskd/slskd:latest
          imagePullPolicy: Always
          env:
            - name: SLSKD_REMOTE_CONFIGURATION
              value: "true"
            - name: SLSKD_DOWNLOADS_DIR
              value: "/music/downloads/slskd/complete"
            - name: SLSKD_INCOMPLETE_DIR
              value: "/music/downloads/slskd/incomplete"
            - name: SLSKD_SHARED_DIR
              value: "/music/Cleaned"
            - name: SLSKD_REMOTE_FILE_MANAGEMENT
              value: "true"
            - name: TZ
              value: "America/New_York"
          envFrom:
          - secretRef:
              name: slskd-config
          ports:
            - name: http
              containerPort: 5030
            - name: slskd-listen
              containerPort: 50300
          resources:
            requests:
              cpu: 20m
              memory: 100Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          # httpGet probes from the kubelet time out because pod-gateway
          # routes node->pod traffic into the VPN. Use exec probes against
          # localhost instead, mirroring the image's own HEALTHCHECK:
          #   HEALTHCHECK --interval=60s --timeout=3s --start-period=60m
          #     --retries=3 CMD wget -q -O - http://localhost:5030/health
          startupProbe:
            exec:
              command: ["wget", "-q", "-O", "-", "http://localhost:5030/health"]
            periodSeconds: 60
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["wget", "-q", "-O", "-", "http://localhost:5030/health"]
            periodSeconds: 60
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["wget", "-q", "-O", "-", "http://localhost:5030/health"]
            periodSeconds: 60
            timeoutSeconds: 3
          volumeMounts:
            - name: slskd-pv
              mountPath: /app
            - name: music
              mountPath: /music
      volumes:
        - name: slskd-pv
          persistentVolumeClaim:
            claimName: slskd-pvc
        - name: music
          hostPath:
            type: Directory
            path: /mnt/ssd01/Music
