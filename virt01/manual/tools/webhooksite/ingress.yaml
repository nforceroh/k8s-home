apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webhooksite-ingress
  annotations:
    cert-manager.io/cluster-issuer: nf-lab
    cert-manager.io/private-key-rotation-policy: Always
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    external-dns.kubernetes.io/target: traefik.k3s.nf.lab
spec:
  ingressClassName: traefik
  rules:
    - host: webhook.k3s.nf.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webhooksite
                port:
                  number: 80
  tls:
    - hosts:
        - webhook.k3s.nf.lab
      secretName: webhooksite-tls
