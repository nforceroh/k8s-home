apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhooksite-redis
  labels:
    app: webhooksite-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webhooksite-redis
  template:
    metadata:
      labels:
        app: webhooksite-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: Always
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: webhooksite-redis
  labels:
    app: webhooksite-redis
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
  selector:
    app: webhooksite-redis
