apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-echo-server
  labels:
    app: webhooksite-echo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webhooksite-echo
  template:
    metadata:
      labels:
        app: webhooksite-echo
    spec:
      containers:
        - name: laravel-echo-server
          image: webhooksite/laravel-echo-server
          imagePullPolicy: Always
          command:
            - exec
            - laravel-echo-server
            - start
            - --force
          env:
            - name: LARAVEL_ECHO_SERVER_AUTH_HOST
              value: http://webhooksite
            - name: LARAVEL_ECHO_SERVER_HOST
              value: 0.0.0.0
            - name: LARAVEL_ECHO_SERVER_PORT
              value: "6001"
            - name: ECHO_REDIS_PORT
              value: "6379"
            - name: ECHO_REDIS_HOSTNAME
              value: webhooksite-redis
            - name: ECHO_PROTOCOL
              value: http
            - name: ECHO_ALLOW_CORS
              value: "true"
            - name: ECHO_ALLOW_ORIGIN
              value: "*"
            - name: ECHO_ALLOW_METHODS
              value: "*"
            - name: ECHO_ALLOW_HEADERS
              value: "*"
          ports:
            - name: echo
              containerPort: 6001
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: laravel-echo-server
  labels:
    app: webhooksite-echo
spec:
  ports:
    - name: echo
      port: 6001
      targetPort: echo
      protocol: TCP
  selector:
    app: webhooksite-echo
