apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webhooked-ingress
  namespace: tools
  annotations:
    cert-manager.io/cluster-issuer: nf-lab
    cert-manager.io/private-key-rotation-policy: Always
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    external-dns.kubernetes.io/target: traefik.k3s.nf.lab
spec:
  ingressClassName: traefik
  rules:
    - host: webhooked.k3s.nf.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webhooked-svc
                port:
                  number: 8000
  tls:
    - hosts:
        - webhooked.k3s.nf.lab
      secretName: webhooked-tls
