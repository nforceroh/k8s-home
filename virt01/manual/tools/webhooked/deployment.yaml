kind: Deployment
apiVersion: apps/v1
metadata:
  name: webhooked
  labels:
    app: webhooked
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: webhooked
  template:
    metadata:
      labels:
        app: webhooked
    spec:
      serviceAccountName: webhooked-sa
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: "Always"
      containers:
        - name: webhooked
          image: ghcr.io/nforceroh/webhooked:latest
          imagePullPolicy: Always
          env:
            - name: DJANGO_DEBUG
              value: "false"
            - name: CAPTURE_BASE_URL
              value: "https://webhooked.k3s.nf.lab,http://webhooked-svc.tools.svc.cluster.local:8000"
            - name: DJANGO_ALLOWED_HOSTS
              value: "webhooked.k3s.nf.lab,webhooked-svc.tools.svc.cluster.local"
            - name: DB_ENGINE
              value: sqlite
            - name: SQLITE_PATH
              value: /data/db.sqlite3
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: webhooked-data
              mountPath: /data
      volumes:
        - name: webhooked-data
          persistentVolumeClaim:
            claimName: webhooked-data
