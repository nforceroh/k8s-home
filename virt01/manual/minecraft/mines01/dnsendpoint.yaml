---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: test-with-end-dot
  namespace: minecraft
spec:
  endpoints:
  - dnsName: _minecraft._tcp.test01.nforcer.com
    recordTTL: 180
    recordType: SRV
    targets:
     - 1 1 25565 ipv4.nforcer.com.
# \"1 1 25565 ipv4.nforcer.com.\" for SRV record — use 
# \"1 1 25565 ipv4.nforcer.com\" not 
# \"1 1 25565 ipv4.nforcer.com.\"."