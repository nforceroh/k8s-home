kind: Deployment
apiVersion: apps/v1
metadata:
  name: mines01
  labels:
    app: mines01
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mines01
  template:
    metadata:
      labels:
        app: mines01
    spec:
      serviceAccountName: mines01-sa
      securityContext:
        runAsUser: 1000
        fsGroup: 1000
      volumes:
        - name: mines01-pv
          persistentVolumeClaim:
            claimName: mines01-pvc
      containers:
        - name: mines01
          image: itzg/minecraft-server:latest
          imagePullPolicy: Always
          resources:
            requests:
              memory: "4Gi"
              cpu: "1000m"
            limits:
              memory: "5Gi" # Give the container extra overhead room above JVM limit
              cpu: "2000m"
          envFrom:
          - configMapRef:
              name: mines01-env
          ports:
            - name: mines01-mc-port
              containerPort: 25565
              protocol: TCP
            - name: mines01-rc-port
              containerPort: 25575
              protocol: TCP
          volumeMounts:
            - name: mines01-pv
              mountPath: /data
