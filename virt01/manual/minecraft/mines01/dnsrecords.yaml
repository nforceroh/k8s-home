---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: mines01-dns
  annotations:
    external-dns: public
spec:
  endpoints:
  - dnsName: mines01.nforcer.com
    recordTTL: 180
    recordType: CNAME
    targets:
    - ipv4.nforcer.com
---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: mines01-srv
  namespace: minecraft
spec:
  endpoints:
  - dnsName: _minecraft._tcp.mines01
    recordTTL: 180
    recordType: SRV
    targets:
     - 0 5 25565 ipv4.nforcer.com