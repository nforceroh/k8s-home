kind: Deployment
apiVersion: apps/v1
metadata:
  name: byparr
  labels:
    app: byparr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: byparr
  template:
    metadata:
      labels:
        app: byparr
      annotations:
        # Opts this pod into the pod-gateway webhook (VPN egress routing).
        setGateway: "true"
    spec:
      serviceAccountName: byparr-sa
      containers:
        - name: byparr
          image: ghcr.io/thephaseless/byparr:latest
          imagePullPolicy: Always
          ports:
            - name: byparr-port
              containerPort: 8191
              protocol: TCP

