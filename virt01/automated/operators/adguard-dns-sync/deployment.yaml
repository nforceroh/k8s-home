apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard-dns-sync
  namespace: external-dns
  labels:
    app: adguard-dns-sync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adguard-dns-sync
  template:
    metadata:
      labels:
        app: adguard-dns-sync
    spec:
      serviceAccountName: adguard-dns-sync
      containers:
        - name: adguard-dns-sync
          image: python:3.11-slim
          command:
            - /bin/sh
            - -c
            - "pip install --no-cache-dir kubernetes requests && python -u /app/main.py"
          envFrom:
            - secretRef:
                name: adguard-dns-sync-env
          volumeMounts:
            - name: script
              mountPath: /app
      volumes:
        - name: script
          configMap:
            name: adguard-dns-sync-script
